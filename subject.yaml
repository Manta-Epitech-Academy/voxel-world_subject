# Subject manifest — convention 2.0 (workshop-content-tools/CONTENT_CONVENTION.md §3.2).
# Port of the World Generator subject: the seven steps in one document, one part.
schema_version: "2.0"

project:
  name: "World Generator"
  slug: "world-generator"
  summary: "Écris en Lua le générateur d'un monde en blocs façon Minecraft : collines, mers, forêts, grottes."
  entrypoint: "intro.md"

# How the subject shows its face on the workshop front page (convention §3.2b).
# A sentence and some files, never a layout. Paths start at the repo root.
cover:
  media: img/cover.gif        # one orbit around the world step 7 ends with
  poster: img/cover.png       # the first frame as a still, for reduced motion
  tagline: "Un bloc, puis un monde entier : montagnes, mers, forêts et grottes écrits en Lua."

# The web app shown beside the instructions. INTERIM, for ctf-0110 only:
# the platform image there has no voxel-world adapter and the cluster serves
# no voxel-world runtime yet, so the app is framed from GitHub Pages
# (voxel-world_runtime, branch wrp-port) as an `external` runtime.
# `?plateforme=1` hides the app's own copy of the text and keeps its step list.
# The target shape is on branch ctfd-workshop-plugin (same-origin runtime,
# token validation).
runtime:
  engine: "voxel-world"
  language: "lua"
  id: "voxel-world"
  version: "4c82e61"          # voxel-world_runtime commit served by Pages
  external: true
  src: "https://manta-epitech-academy.github.io/voxel-world_runtime/index.html?plateforme=1"
  title: "World Generator"
  pane:
    placement: side
    open: false
    size: 60                  # a little wider: the 3D world needs room

platform:
  mode_default: instructor_led
  # INTERIM: a cross-origin runtime cannot receive the token secret, so each
  # step is validated by the code the instructor reads out once the runtime's
  # checks are green (convention §3.3b, `checkpoint`). Steps keep their
  # token_id for when the runtime is served same-origin.
  validation_default: checkpoint
  points_default: 25

documents:
  - intro.md
  - world-generator.md
